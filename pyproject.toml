[project]
name = "ats-gap-analyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rakesh-76", email = "126546183+rakesh-76@users.noreply.github.com" }
]
requires-python = ">=3.12.10"
dependencies = [
    "pdfplumber>=0.11.10",
    "python-docx>=1.2.0",
    "sentence-transformers>=6.0.1",
    "spacy>=3.8.16",
    "streamlit>=1.63.0",
]

[project.scripts]
ats-gap-analyzer = "ats_gap_analyzer:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]